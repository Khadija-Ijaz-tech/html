<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <div class="calculator">
        <div class="display">
            <p class="expression">38,670 + 50,000</p>
            <h3 class="result">0.7734</h3>
        </div>
    <div class="button">

    <button class=" buttons light">AC</button>
    <button class=" buttons light">+/-</button>
    <button class=" buttons light">%</button>
    <button class=" buttons operator">/</button>

    <button class ="buttons dark">7</button>
    <button class ="buttons dark">8</button>
    <button class ="buttons dark">9</button>
    <button class ="buttons operator">x</button>

    <button class ="buttons dark">4</button>
    <button class ="buttons dark">5</button>
    <button class ="buttons dark">6</button>
    <button class ="buttons operator">-</button>

    <button class ="buttons dark">1</button>
    <button class ="buttons dark">2</button>
    <button class ="buttons dark">3</button>
    <button class ="buttons operator">+</button>

    <button class ="buttons dark">#</button>
    <button class ="buttons dark">0</button>
    <button class ="buttons dark">.</button>
    <button class ="buttons operator">=</button>


</div>
</div>

</body>
</html>
